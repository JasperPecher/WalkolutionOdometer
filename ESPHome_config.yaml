esphome:
  name: "walkolution"
  friendly_name: Walkolution
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

#Enable Logging
logger:
  # level: WARN # This stops the ESP32 from trying to print every single pulse

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ble_client:
  - mac_address: "EA:3D:D0:84:D5:AB"
    id: magene_s314

sensor:
  - platform: ble_client
    type: characteristic
    ble_client_id: magene_s314
    name: "Walkolution revolutions raw"
    id: revs_raw
    service_uuid: "1816"
    characteristic_uuid: "2A5B"
    notify: true
    lambda: |-
      if (x.size() >= 5 && (x[0] & 0x01)) {
        uint32_t revs = x[1] | (x[2] << 8) | (x[3] << 16) | (x[4] << 24);
        return revs;
      }
      return {};
