# ── Wiring ───────────────────────────────
# ── Display ─────────
# GND	GND
# VCC	3.3V
# SCL	GPIO18
# SDA	GPIO23
# RES	GPIO4
# DC	GPIO26
# CS	GPIO15
# BLK	GPIO32

# ── KY-003 Sensor ─────────
# - GND
# middle 3V
# S <-> optocopler <-> GPIO25

# ── Wiring ───────────────────────────────
# ── KY-003 Sensor ─────────
# - GND
# middle 3V
# S <-> optocopler <-> GPIO25

esphome:
  name: "walkolution"
  friendly_name: Walkolution
  min_version: 2025.11.0
  name_add_mac_suffix: false
      

esp32:
  variant: esp32
  framework:
    type: esp-idf
    
#Enable Logging
logger:
 # level: WARN # This stops the ESP32 from trying to print every single pulse

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ── Calibration parameters (set from Home Assistant) ───────────────────
globals:
  - id: magnets_per_rev
    type: int
    initial_value: '1'
  - id: travel_per_rev_mm
    type: int
    initial_value: '362'
  - id: step_length_m
    type: float
    initial_value: '0.7'

# ── All sensors in ONE block to avoid duplicate-key errors ──────────────────────
sensor:
  - platform: uptime
    name: "Axle ESP32 Uptime"
    id: axle_uptime
    update_interval: 10s
    
  - platform: pulse_meter
    id: axle_pm
    name: "Axle Speed"
    pin:
      number: GPIO25
      mode: INPUT # The module has its own pull-up resistor, so we don't need INPUT_PULLUP
      inverted: true 
    internal_filter: 50ms 
    total:
      id: axle_total
      name: "Axle pulses total"

  # Axle RPM derived from pulses/min and magnets per revolution
  - platform: template
    id: axle_rpm
    name: "Axle RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev)> 0.0 ? id(magnets_per_rev) : 1.0;
      return id(axle_pm).state / magnets;

  # Instant walking speed (km/h)
  - platform: template
    id: speed_kmh
    name: "Walking speed"
    unit_of_measurement: "km/h"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev) : 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0; // mm -> m
      float revs_per_min = id(axle_pm).state / magnets;
      float m_per_min = revs_per_min * travel_m;
      return (m_per_min * 60.0f) / 1000.0;  // -> km/h

  # Total distance since boot
  - platform: template
    id: distance_boot_km
    name: "Distance since boot"
    unit_of_measurement: "km"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev): 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0; // mm -> m
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / 1000;

  - platform: template
    id: steps_today
    name: "Steps today"
    unit_of_measurement: "steps"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev): 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0;
      const float step_len = id(step_length_m);
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / step_len;
