# Wiring
# VCC → 3.3 V
# GND → GND
# SCL (SPI clock) → ESP32 GPIO18 (SCLK)
# SDA (SPI MOSI) → ESP32 GPIO19 (MOSI)
# DC (Data/Command) → ESP32 GPIO16 (any free GPIO)
# RES (Reset) → ESP32 GPIO23 (any free GPIO)
# CS (Chip Select) → ESP32 GPIO5 (or tie low if your board truly has no CS pin)
# BLK (Backlight) → ESP32 GPIO4 (optional, PWM/ON/OFF)


esphome:
  name: walkingpad
  friendly_name: Walking Pad (ST7789 240x280, MIPI/ILI)

esp32:
  board: esp32dev

logger:
api:
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WalkingPad Fallback"
    password: "changeme"

# ── SPI bus for ST7789 ──────────────────────────────────────────────────────────
spi:
  clk_pin: GPIO18   # SCL / SCK
  mosi_pin: GPIO19  # SDA / MOSI
  # MISO not used

# ── Fonts ───────────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    bpp: 4

# ── Colors ─────────────────────────────────────────────────────────────────────
color:
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_cyan
    red: 0%
    green: 100%
    blue: 100%

# ── Axle pulses + derived sensors (from previous config) ────────────────────────
number:
  - platform: template
    name: "Magnets per revolution"
    id: magnets_per_rev
    min_value: 1
    max_value: 12
    step: 1
    optimistic: true
    restore_value: true

  - platform: template
    name: "Axle travel per rev (mm)"
    id: travel_per_rev_mm
    min_value: 50
    max_value: 5000
    step: 1
    optimistic: true
    restore_value: true

  - platform: template
    name: "Step length (m)"
    id: step_length_m
    min_value: 0.40
    max_value: 1.20
    step: 0.01
    optimistic: true
    restore_value: true

sensor:
  - platform: pulse_meter
    id: axle_pm
    name: "Axle pulses/min"
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
    internal_filter: 2ms
    internal_filter_mode: PULSE
    timeout: 10s
    total:
      id: axle_total
      name: "Axle pulses total"

  - platform: template
    id: axle_rpm
    name: "Axle RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      return id(axle_pm).state / magnets;

  - platform: template
    id: speed_kmh
    name: "Walking speed"
    unit_of_measurement: "km/h"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f; // mm -> m
      float revs_per_min = id(axle_pm).state / magnets;
      float m_per_min = revs_per_min * travel_m;
      return (m_per_min * 60.0f) / 1000.0f;  // km/h

  - platform: template
    id: distance_total_km
    name: "Distance total"
    unit_of_measurement: "km"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f;
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / 1000.0f;

  - platform: integration
    name: "Distance today"
    id: distance_today_km
    sensor: speed_kmh
    time_unit: h
    unit_of_measurement: "km"
    state_class: total
    restore: true

  - platform: integration
    name: "Steps today"
    id: steps_today
    sensor: speed_kmh
    time_unit: h
    unit_of_measurement: "steps"
    state_class: total
    restore: true
    lambda: |-
      const float step_len = id(step_length_m).state;
      return (x * 1000.0f) / step_len;

  - platform: template
    id: steps_total
    name: "Steps total"
    unit_of_measurement: "steps"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f;
      const float step_len = id(step_length_m).state;
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / step_len;

# ── Small speed graph (5 minutes) ──────────────────────────────────────────────
graph:
  - id: speed_graph
    sensor: speed_kmh
    duration: 5min
    width: 228
    height: 70
    x_grid: 1min
    y_grid: 1.0
    border: true

# ── Display using newer MIPI/ILI driver ─────────────────────────────────────────
# OPTION A: If your module is the Adafruit round-rect 280x240 (rotated):
display:
  - platform: ili9xxx
    id: tft
    model: "Adafruit RR 280x240"   # preset model (round-rect)
    cs_pin: GPIO5
    dc_pin: GPIO16
    reset_pin: GPIO23
    backlight_pin: GPIO4
    rotation: 270                  # try 0/90/180/270 to match orientation
    update_interval: 500ms
    pages:
      - id: dashboard
        lambda: |-
          it.printf(8, 6, id(roboto_20), id(my_yellow), "Walking Pad");
          it.printf(8, 34, id(roboto_28), id(my_white), "Speed: %.2f km/h", id(speed_kmh).state);
          it.printf(8, 70, id(roboto_20), id(my_white), "Today: %.3f km", id(distance_today_km).state);
          it.printf(8, 96, id(roboto_20), id(my_white), "Total: %.3f km", id(distance_total_km).state);
          it.printf(8, 124, id(roboto_20), id(my_white), "Steps: %.0f / %.0f", id(steps_today).state, id(steps_total).state);
          it.printf(8, 152, id(roboto_14), id(my_cyan), "Axle RPM: %.1f", id(axle_rpm).state);
          it.graph(6, 176, id(speed_graph), id(my_yellow))

