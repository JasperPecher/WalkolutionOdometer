# Wiring
# ── Display ─────────
# GND	GND
# VCC	3.3V
# SCL	GPIO18
# SDA	GPIO23
# RES	GPIO4
# DC	GPIO2
# CS	GPIO5
# BLK	3.3V
# ── KY-003 Sensor ─────────
# - GND
# middle 5V
# S GPIO27

esphome:
  name: walkolution
  friendly_name: Walkolution
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf
    
#Enable Logging
logger:
  logs:
    component: ERROR

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ── Calibration parameters (set from Home Assistant) ───────────────────
globals:
  - id: magnets_per_rev
    type: int
    initial_value: '1'
  - id: travel_per_rev_mm
    type: int
    initial_value: '362'
  - id: step_length_m
    type: float
    initial_value: '0.4'

# ── All sensors in ONE block to avoid duplicate-key errors ──────────────────────
sensor:
  # Axle hall pulses: use pulse_meter for better low-speed behavior
  - platform: pulse_meter
    id: axle_pm
    name: "Axle pulses/min"
    pin:
      number: GPIO27
      mode: 
        input: true
        pullup: true       # KY-003 is open-collector style; pull-up stabilizes input
    internal_filter: 2ms
    internal_filter_mode: PULSE
    timeout: 10s
    total:
      id: axle_total
      name: "Axle pulses total"

  # Axle RPM derived from pulses/min and magnets per revolution
  - platform: template
    id: axle_rpm
    name: "Axle RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev)> 0.0 ? id(magnets_per_rev) : 1.0;
      return id(axle_pm).state / magnets;

  # Instant walking speed (km/h)
  - platform: template
    id: speed_kmh
    name: "Walking speed"
    unit_of_measurement: "km/h"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev) : 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0; // mm -> m
      float revs_per_min = id(axle_pm).state / magnets;
      float m_per_min = revs_per_min * travel_m;
      return (m_per_min * 60.0f) / 1000.0;  // -> km/h

  # Total distance since boot
  - platform: template
    id: distance_boot_km
    name: "Distance since boot"
    unit_of_measurement: "km"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev): 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0; // mm -> m
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / 1000;

  - platform: template
    id: steps_today
    name: "Steps today"
    unit_of_measurement: "steps"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev) > 0.0 ? id(magnets_per_rev): 1.0;
      const float travel_m = id(travel_per_rev_mm) / 1000.0;
      const float step_len = id(step_length_m);
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / step_len;


# ── Colors ─────────────────────────────────────────────────────────────────────
color:
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_cyan
    red: 0%
    green: 100%
    blue: 100%

# ── Fonts ───────────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: roboto_20
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_14
    size: 14
    bpp: 4

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  interface: hardware # Force hardware SPI for stability

time:
  - platform: homeassistant
    id: esptime

display:
  - platform: st7789v
    model: custom
    width: 240
    height: 320
    rotation: 270
    offset_height: 0
    offset_width: 0
    cs_pin: GPIO5
    dc_pin: GPIO26      
    reset_pin: GPIO4
    eightbitcolor: true
    lambda: |-
          it.strftime(20, 30, id(roboto_28), TextAlign::BASELINE_LEFT, "%H:%M", id(esptime).now());
          it.printf(20, 45, id(roboto_28), id(my_white), "Speed: %.2f km/h", id(speed_kmh).state);
          it.printf(20, 75, id(roboto_28), id(my_white), "Distance: %.2f km", id(distance_boot_km).state);
          it.printf(20, 124, id(roboto_20), id(my_white), "Steps: %.0f / %.0f", id(steps_today).state);
          it.printf(20, 152, id(roboto_14), id(my_cyan), "Axle RPM: %.1f", id(axle_rpm).state);
