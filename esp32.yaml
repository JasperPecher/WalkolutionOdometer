
esphome:
  name: walkingpad
  friendly_name: Walking Pad (Axle Hall)

esp32:
  board: esp32dev

logger:
api:
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WalkingPad Fallback"
    password: "changeme"

# ── Hall pulses from AXLE ───────────────────────────────────────────────────────
# We use pulse_meter because it measures the time between pulses -> smooth at low RPM.
# (intended as drop-in replacement for pulse_counter with better low-rate behavior)
# Docs: https://esphome.io/components/sensor/pulse_meter/
sensor:
  - platform: pulse_meter
    id: axle_pm
    name: "Axle pulses/min"
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true         # KY-003 is open-collector style; pull-up stabilizes the line
    internal_filter: 2ms      # Debounce; increase if you see double-counting
    internal_filter_mode: PULSE
    timeout: 10s
    total:
      id: axle_total
      name: "Axle pulses total"

# ── Editable calibration parameters (from HA) ───────────────────────────────────
number:
  - platform: template
    name: "Magnets per revolution"
    id: magnets_per_rev
    min_value: 1
    max_value: 12
    step: 1
    optimistic: true
    restore_value: true

  # This is the LINEAR travel per one axle revolution.
  # If the axle IS the belt roller, this is the roller circumference.
  # If there is gearing, use: circumference * (roller revs per axle rev).
  - platform: template
    name: "Axle travel per rev (mm)"
    id: travel_per_rev_mm
    min_value: 50
    max_value: 5000
    step: 1
    optimistic: true
    restore_value: true

# ── Derived sensors (RPM, speed, distances) ─────────────────────────────────────
sensor:
  # Axle RPM
  - platform: template
    id: axle_rpm
    name: "Axle RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      float pulses_per_min = id(axle_pm).state;
      return pulses_per_min / magnets;

  # Instant walking speed (km/h)
  - platform: template
    id: speed_kmh
    name: "Walking speed"
    unit_of_measurement: "km/h"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f; // mm -> m
      float pulses_per_min = id(axle_pm).state;
      float revs_per_min = pulses_per_min / magnets;
      float m_per_min = revs_per_min * travel_m;
      return (m_per_min * 60.0f) / 1000.0f;  // -> km/h

  # Total distance since boot, from total pulses
  - platform: template
    id: distance_total_km
    name: "Distance total"
    unit_of_measurement: "km"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f;
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / 1000.0f;

  # Distance today: integrate speed over time (km/h * h -> km)
  - platform: integration
    name: "Distance today"
    sensor: speed_kmh
    time_unit: h
    unit_of_measurement: "km"
    state_class: total
   
