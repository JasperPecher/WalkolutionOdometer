
esphome:
  name: walkingpad
  friendly_name: Walking Pad (Axle Hall)

esp32:
  board: esp32dev

logger:
api:
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WalkingPad Fallback"
    password: "changeme"

# ── Editable calibration parameters (set from Home Assistant) ───────────────────
number:
  - platform: template
    name: "Magnets per revolution"
    id: magnets_per_rev
    min_value: 1
    max_value: 12
    step: 1
    optimistic: true
    restore_value: true

  # Linear travel per ONE axle revolution (mm)
  # If the axle directly drives the belt roller: this equals roller circumference.
  - platform: template
    name: "Axle travel per rev (mm)"
    id: travel_per_rev_mm
    min_value: 50
    max_value: 5000
    step: 1
    optimistic: true
    restore_value: true

# ── All sensors in ONE block to avoid duplicate-key errors ──────────────────────
sensor:
  # Axle hall pulses: use pulse_meter for better low-speed behavior
  - platform: pulse_meter
    id: axle_pm
    name: "Axle pulses/min"
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true       # KY-003 is open-collector style; pull-up stabilizes input
    internal_filter: 2ms
    internal_filter_mode: PULSE
    timeout: 10s
    total:
      id: axle_total
      name: "Axle pulses total"

  # Axle RPM derived from pulses/min and magnets per revolution
  - platform: template
    id: axle_rpm
    name: "Axle RPM"
    unit_of_measurement: "rpm"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      return id(axle_pm).state / magnets;

  # Instant walking speed (km/h)
  - platform: template
    id: speed_kmh
    name: "Walking speed"
    unit_of_measurement: "km/h"
    state_class: measurement
    update_interval: 1s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f; // mm -> m
      float revs_per_min = id(axle_pm).state / magnets;
      float m_per_min = revs_per_min * travel_m;
      return (m_per_min * 60.0f) / 1000.0f;  // -> km/h

  # Total distance since boot
  - platform: template
    id: distance_total_km
    name: "Distance total"
    unit_of_measurement: "km"
    state_class: total_increasing
    update_interval: 10s
    lambda: |-
      const float magnets = id(magnets_per_rev).state > 0 ? id(magnets_per_rev).state : 1.0f;
      const float travel_m = id(travel_per_rev_mm).state / 1000.0f;
      float revs_total = id(axle_total).state / magnets;
      float meters = revs_total * travel_m;
      return meters / 1000.0f;

  # Distance today: integrates speed (km/h) over time → km
  - platform: integration
    name: "Distance today"
    sensor: speed_kmh
    time_unit: h
    unit_of_measurement: "km"
    state_class: total
    restore: true
